# Orbyn Planner web. The security headers come from snippets/security-headers.conf, which
# scripts/headers.mjs writes for each build.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/wasm image/svg+xml text/plain;

  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-cache" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Built files carry a hash in their name. nginx drops inherited headers when a location
  # adds its own, so the security headers are included again.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # A single-page app: any other path, such as /cancel-deletion, is the app.
  location / { try_files $uri /index.html; }
}
