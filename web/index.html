<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/styles/boot.css" />
    <script>
      /* Set the theme before the first paint so there is no flash. Keep in step with src/ui/theme.ts. */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("orbyn-planner.theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark" && t !== "dim") {
          t = "light";
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            var d = null;
            try {
              d = localStorage.getItem("orbyn-planner.dark-theme");
            } catch (e) {}
            t = d === "dim" ? "dim" : "dark";
          }
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>Orbyn Planner</title>
  </head>
  <body>
    <!-- The splash while the app opens (Planner Designs p-splash): the mark at 64 px in --t2 on --bg, drawn
         before the bundle runs. src/app/bootSplash.ts takes it away once the first real screen has painted. -->
    <div id="boot" role="status" aria-label="Opening Orbyn Planner">
      <svg class="boot-mark" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
        <defs>
          <mask id="boot-knock" maskUnits="userSpaceOnUse" x="-44" y="-44" width="600" height="600">
            <rect x="-44" y="-44" width="600" height="600" fill="#fff" />
            <circle cx="256" cy="131.5" r="45" fill="#000" />
          </mask>
        </defs>
        <g mask="url(#boot-knock)">
          <circle cx="256" cy="256" r="124.5" fill="none" stroke="currentColor" stroke-width="29" />
        </g>
        <circle cx="256" cy="131.5" r="31" fill="currentColor" />
      </svg>
    </div>
    <script>
      /* The wait before the splash appears: its length and the fade are --m-wait and --m-fast in boot.css. */
      requestAnimationFrame(function () {
        var boot = document.getElementById("boot");
        if (boot) boot.setAttribute("data-wait", "");
      });
    </script>
    <div id="root" aria-busy="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
